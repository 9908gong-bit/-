<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>운빨 망겜 체스</title>
<style>
:root{--bg:#e6eef0;--fg:#1d2b32;--card:#fff;--ln:#b9c8cd;--l:#cfe3dc;--d:#5f8f8a;--ac:#f08a24;--sel:#ffd43b;--mv:rgba(30,140,70,.6);--cp:rgba(230,50,50,.75);box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14202a;--fg:#e8f0f2;--card:#1f303c;--ln:#35505f;--l:#9dbfb6;--d:#3f6b69}}
:root[data-theme="dark"]{--bg:#14202a;--fg:#e8f0f2;--card:#1f303c;--ln:#35505f;--l:#9dbfb6;--d:#3f6b69}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:10px;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:480px;margin:0 auto}
h1{font-size:20px;margin:4px 0 8px}
.row{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;padding:7px 11px;border:1px solid var(--ln);background:var(--card);color:var(--fg);border-radius:8px;cursor:pointer}
button.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
#st{font-weight:700;margin:10px 0 2px;font-size:17px}
#tm,#info{font-size:13px;opacity:.85;min-height:20px}
#bd{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));width:100%;aspect-ratio:1;margin:8px 0;border:2px solid var(--fg);border-radius:4px;overflow:hidden}
.c{position:relative;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;font-size:clamp(24px,8.6vw,44px);line-height:1;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.c.l{background:var(--l)}.c.d{background:var(--d)}
.pw{color:#fff;text-shadow:0 0 2px #000,0 0 3px #000,0 0 3px #000}
.pb{color:#161616;text-shadow:0 0 1px #fff,0 0 1px #fff}
.hp{position:absolute;left:10%;right:10%;bottom:3%;height:4px;background:rgba(0,0,0,.45);border-radius:2px;overflow:hidden}
.hp i{display:block;height:100%}
.c.sel{outline:3px solid var(--sel);outline-offset:-3px}
.c.mv::after{content:"";position:absolute;width:28%;height:28%;border-radius:50%;background:var(--mv)}
.c.cp{box-shadow:inset 0 0 0 4px var(--cp)}
.c.fl{animation:fl .65s}
@keyframes fl{50%{background:#ff5252}}
@media(prefers-reduced-motion:reduce){.c.fl{animation:none;background:#ff5252}}
#log{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;font-size:13px;min-height:110px}
#log div:last-child{font-weight:700}
#pm,#bt,#cn,#rs,#gm,#lb,#ag,#av,#ad{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:9}
#pm[hidden],#bt[hidden],#cn[hidden],#rs[hidden],#gm[hidden],#lb[hidden],#ag[hidden],#av[hidden],#ad[hidden]{display:none}
#pm>div,#cn>div,#rs>div,#gm>div,#lb>div,#ag>div,#av>div,#ad>div{background:var(--card);padding:16px;border-radius:12px;text-align:center}
#pm .row,#rs .row{justify-content:center;margin-top:10px}
#stg{position:relative;width:min(92vw,440px);height:270px;border-radius:12px;overflow:hidden;background:linear-gradient(#86a8bd 0 68%,#6b5a43 68%);box-shadow:0 8px 30px #000a}
.fg{position:absolute;bottom:22%;width:96px;text-align:center;color:#fff;font-size:12px;font-weight:600;text-shadow:0 1px 3px #000}
.fg svg{display:block;margin:0 auto}
.hb{width:72px;height:7px;margin:2px auto 4px;background:rgba(0,0,0,.5);border-radius:4px;overflow:hidden}
.hb i{display:block;height:100%;background:#2fb344;transition:width .5s .1s}
#bn{position:absolute;top:10px;left:0;right:0;text-align:center;font-weight:800;font-size:22px;color:#ffd43b;text-shadow:0 2px 5px #000;z-index:2}
#fx{position:absolute;inset:0;pointer-events:none}
#fx div{position:absolute}
.tg{display:inline-block;padding:0 6px;border-radius:7px;font-size:11px;color:#fff;margin-right:4px}
#bn small{display:block;font-size:13px;color:#fff}
#bn b{display:block;min-height:26px}
#coin{width:110px;height:110px;margin:6px auto;border-radius:50%;background:radial-gradient(#ffe27a,#d4a017);border:4px solid #a77b0c;display:flex;align-items:center;justify-content:center;font:800 40px system-ui;color:#5a3d00}
#cr{font-size:20px;font-weight:800;min-height:28px;margin-top:8px}
#rt{font-size:30px;font-weight:800;margin:4px 0}
#rr{margin-bottom:6px}
#gm>div,#ad>div{max-height:86vh;overflow:auto;width:min(94vw,460px);text-align:left}
.gh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.gc{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--ln)}
.gp{flex:none;width:96px;height:96px;background:#86a8bd;border-radius:8px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;overflow:hidden}
.gs{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.gs span{background:var(--bg);border-radius:6px;padding:1px 7px;font-size:12px}
.gm{font-size:12px;opacity:.85}
.gn{font-size:12px;opacity:.8;margin:8px 0 0}
#bd.nm .hp{display:none}
#ag>div,#av>div{width:min(94vw,400px);max-height:90vh;overflow:auto}
#ac2 button{font-size:13px;padding:4px 9px}
.em{text-align:center;line-height:1.2;margin:4px 0}.ge{flex:none;width:52px;text-align:center}
.ac{border:2px solid var(--ln);border-radius:12px;padding:8px 10px;margin:8px 0;background:var(--bg);cursor:pointer}
.ac.no{opacity:.6;cursor:default}
.an{font-weight:800;font-size:17px}.ac svg{display:block;margin:4px auto}.at{font-size:13px;text-align:left}
#lb>div{width:min(94vw,360px)}
#lbc{font:inherit;padding:7px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--fg);width:170px}
</style></head><body><main>
<h1>운빨 망겜 체스</h1>
<div class="row" id="menu">
<button data-m="">2인 대전</button><button data-m="easy">AI 이지</button><button data-m="normal">AI 노말</button><button data-m="hard">AI 하드</button><button data-m="impossible">AI 불가능</button><button data-m="online">온라인 대전</button>
</div>
<div class="row" id="cl" style="margin-top:6px;align-items:center"><span id="cc" class="row" style="align-items:center"><span>내 색</span><button data-c="w">백</button><button data-c="b">흑</button></span><button id="nmb">일반 체스 룰</button><button id="agb">증강 모드</button><button id="gd">기물 설명서</button><button id="agd">증강 설명서</button></div>
<div class="row" style="margin-top:6px"><button id="go" class="on">시작</button></div>
<div id="st"></div><div id="tm"></div><div id="ac2" class="row" style="margin:4px 0"></div>
<div id="bd"></div>
<div id="info">기물을 누르면 능력치가 보여요.</div>
<div id="log" style="margin-top:8px"></div>
<div id="pm" hidden><div>승격할 기물을 고르세요<div class="row"><button data-t="N">나이트</button><button data-t="B">비숍</button><button data-t="R">룩</button><button data-t="Q">퀸</button></div></div></div>
<div id='lb' hidden><div><div class='gh'><b>온라인 대전</b><button id='lx'>닫기</button></div><div class='row'><button id='lmk'>방 만들기 (내 색: 위에서 선택)</button></div><div class='row' style='margin-top:8px'><input id='lbc' maxlength='20' placeholder='비밀번호 (직접 만들기)'><button id='ljn'>입장</button></div><p id='lbm' class='gn'></p></div></div>
<div id='gm' hidden><div><div class='gh'><b>기물 설명서</b><button id='gx'>닫기</button></div><div id='gl'></div><p class='gn'>치명타는 명중했을 때 공격력의 2배예요 · 공격받고 살아남으면 반격해요 · HP는 저절로 회복되지 않아요.</p></div></div>
<div id='ag' hidden><div><div class='gh'><b id='agt'></b></div><div id='ags'></div><div id='agl'></div></div></div>
<div id='av' hidden><div><div class='gh'><b>이번 판 증강</b><button id='avx'>닫기</button></div><div id='avl'></div></div></div>
<div id='ad' hidden><div><div class='gh'><b>증강 설명서 (45종)</b><button id='adx'>닫기</button></div><div id='adl'></div></div></div>
<div id='cn' hidden><div><div id='coin'>?</div><div id='cr'></div></div></div>
<div id='rs' hidden><div><div id='rt'></div><div id='rr'></div><div class='row'><button id='again'>한 판 더</button><button id='see'>보드 보기</button></div></div></div>
<div id='bt' hidden><div id='stg'><div id='bn'></div><div class='fg' id='fw' style='left:7%'></div><div class='fg' id='fb' style='right:7%'></div><div id='fx'></div></div></div>
</main>
<script>

/* 서버 연결: 이 페이지가 직접 만든 서버(같은 주소)와 웹소켓으로 방 정보를 주고받아요 */
(()=>{const WSU=(location.protocol=='https:'?'wss://':'ws://')+location.host;
let ws=null,ok=null,seq=0;const P={},S={};
const uid=(()=>{try{let u=localStorage.getItem('lcid');if(!u){u=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('lcid',u)}return u}catch(e){return Math.random().toString(36).slice(2)}})();
const sn=d=>({exists:d!=null,data:()=>d==null?undefined:JSON.parse(JSON.stringify(d))});
function conn(){if(ok)return ok;let opened=false;
 ok=new Promise(res=>{const open=()=>{ws=new WebSocket(WSU);
  ws.onopen=()=>{opened=true;Object.keys(S).forEach(p=>ws.send(JSON.stringify({op:'sub',path:p})));res()};
  ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.rid&&P[m.rid]){P[m.rid](m);delete P[m.rid]}else if(m.op=='snap')(S[m.path]||[]).forEach(f=>f(sn(m.data)))};
  ws.onclose=()=>{if(opened){ok=null;setTimeout(conn,1500)}else setTimeout(open,1500)}};open()});
 return ok}
const call=async m=>{await conn();return Promise.race([new Promise(r=>{m.rid=++seq;P[m.rid]=r;ws.send(JSON.stringify(m))}),new Promise((_,j)=>setTimeout(()=>j({code:'timeout'}),15000))]).then(r=>{if(r.err)throw{code:r.err};return r})};
const db={doc:path=>({
 get:async()=>sn((await call({op:'get',path})).data),
 set:async d=>{await call({op:'set',path,data:d})},
 update:async d=>{await call({op:'upd',path,data:d})},
 onSnapshot:(next)=>{(S[path]=S[path]||[]).push(next);conn().then(()=>ws.send(JSON.stringify({op:'sub',path})));return()=>{S[path]=S[path].filter(x=>x!==next)}}})};
window.claude={use:async n=>n=='db'?db:n=='user'?{id:async()=>uid}:null};
setInterval(()=>{if(ws&&ws.readyState==1&&Object.keys(S).some(p=>S[p].length))ws.send('{"op":"hb"}')},240000);
})();

</script>
<script>
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const ST={
P:{n:"폰",g:"♟\uFE0E",hp:100,a:25,h:.7,d:.09,c:.05,v:1},
N:{n:"나이트",g:"♞",hp:125,a:35,h:.8,d:.15,c:.2,v:3},
B:{n:"비숍",g:"♝",hp:110,a:25,h:.9,d:.09,c:.09,v:3},
R:{n:"룩",g:"♜",hp:200,a:50,h:.9,d:.03,c:.15,v:5},
Q:{n:"퀸",g:"♛",hp:150,a:45,h:.9,d:.14,c:.25,v:9},
K:{n:"킹",g:"♚",hp:200,a:55,h:.95,d:.1,c:.2,v:20}};
const D={N:[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]],B:[[1,1],[1,-1],[-1,1],[-1,-1]],R:[[1,0],[-1,0],[0,1],[0,-1]]};
D.Q=D.B.concat(D.R);D.K=D.Q;D.U=[[3,2],[2,3],[-3,2],[-2,3],[3,-2],[2,-3],[-3,-2],[-2,-3]];D.T=[];for(let a=-2;a<3;a++)for(let b=-2;b<3;b++)if(a||b)D.T.push([a,b]);
const dk=p=>{const g=G.aug&&G.aug[p.c];return p.t=='N'&&g==1?'U':p.t=='K'&&g==11?'N':p.t=='K'&&g==36?'T':p.t};
const mk=(t,c)=>({t,c,hp:ST[t].hp,m:0}),nm=p=>(p.c=="w"?"백 ":"흑 ")+ST[p.t].n;
const LV={"":"2인 대전",easy:"AI 이지",normal:"AI 노말",hard:"AI 하드",impossible:"AI 불가능"};
let G=null;

function initBoard(){const b=Array(64).fill(null),k="RNBQKBNR";
 for(let x=0;x<8;x++){b[x]=mk(k[x],"b");b[8+x]=mk("P","b");b[48+x]=mk("P","w");b[56+x]=mk(k[x],"w")}
 return b}

function moves(b,i){const p=b[i],r=i>>3,c=i&7,o=[];
 if(p.t=="P"){const dr=p.c=="w"?-1:1,r1=r+dr;
  if(r1<0||r1>7)return o;
  if(!b[r1*8+c]){o.push({to:r1*8+c});if(G.aug&&G.aug[p.c]==15){for(let k=2;k<4;k++){const rk=r+k*dr;if(rk<0||rk>7||b[rk*8+c])break;o.push({to:rk*8+c})}}else if(!p.m&&!b[(r+2*dr)*8+c])o.push({to:(r+2*dr)*8+c})}
  for(const dc of[-1,1]){const cc=c+dc;if(cc<0||cc>7)continue;const t=b[r1*8+cc];if(t&&t.c!=p.c)o.push({to:r1*8+cc,cap:1})}
  return o}
 const sl="BRQ".includes(p.t);
 for(const[dr,dc]of D[dk(p)]){let rr=r+dr,cc=c+dc;
  while(rr>=0&&rr<8&&cc>=0&&cc<8){const t=b[rr*8+cc];
   if(t){if(t.c!=p.c)o.push({to:rr*8+cc,cap:1});break}
   o.push({to:rr*8+cc});if(!sl)break;rr+=dr;cc+=dc}}
 return o}

function roll(a,d){const A=SX(a),B=SX(d),cr=rnd()<A.c&&!(G.aug&&G.aug[d.c]==2&&d.t=='R'),hit=rnd()<A.h,dg=hit&&rnd()<B.d&&!(G.aug&&G.aug[a.c]==31);let dmg=0,h0=d.hp,rv='';
 if(hit&&!dg){dmg=A.a*(cr?2:1);d.hp-=dmg;
  if(a.t=='B'&&G.aug&&G.aug[a.c]==43&&d.hp>0&&d.hp<=SX(d).hp*.25){d.hp=0;rv=' — 처형!'}
  if(d.hp<=0){if(revive(d))rv=' — 되살아난 망령! 킹 부활(HP 50)';else if(saves(d))rv=' — 억지부리기! 부활'}}
 return{cr,hit,dg,dmg,hp0:h0,txt:nm(a)+' → '+nm(d)+': '+(!hit?'빗나감':dg?(cr?'치명타 공격을 ':'공격을 ')+'회피!':(cr?'치명타! ':'명중 ')+'-'+dmg)+rv}}

const log=s=>{G.log.push(s.txt||s)};
function flash(...c){G.fl=c;render();const g=G;setTimeout(()=>{if(g===G){g.fl=[];render()}},650)}

async function act(f,t){if(G.nm)return actN(f,t);const g=G;g.busy=1;g.sel=null;const b=g.b,a=b[f],d=b[t];
 if(!d){b[t]=a;b[f]=null;a.m=1}
 else{
  {const r=roll(a,d);log(r);await duel(a,d,r);if(g!==G)return}
  if(d.hp<=0){await killed(a,f,d,t);if(g!==G)return}
  else if(moves(b,t).some(m=>m.to==f&&m.cap)){
   {const r=roll(d,a);log('반격! '+r.txt);await duel(d,a,r,1);if(g!==G)return}
   if(a.hp<=0){await killedC(d,a,f);if(g!==G)return}}}
 render();
 const p=b[t];
 if(p===a&&a.t=="P"&&(t>>3)==(a.c=="w"?0:7)){await promote(t);if(g!==G)return}
 end()}

function promote(i){const p=G.b[i],set=t=>{p.t=t;delete p.ab;p.hp=SX(p).hp;log(nm(p)+" 승격!")};
 if(G.fpr){set(G.fpr);return}
 if(G.aug&&G.aug[p.c]==3){const t='NRQB'[Math.random()*4|0];G.rpr=t;set(t);return}
 if(G.ai&&p.c==G.ac){set("Q");return}
 return new Promise(res=>{$("#pm").hidden=false;G.pr=t=>{G.rpr=t;set(t);$("#pm").hidden=true;res()}})}

function fin(w,msg){G.over=1;G.busy=0;const t=w?(w=='w'?'백':'흑')+' 승리!':'무승부';G.res=t;G.rw=w;G.rm=msg;if(G.on)LS.set(null);log(msg+' — '+t);$('#rt').textContent=t;$('#rr').textContent=msg;$('#rs').hidden=false;render()}

function end(){const b=G.b;G.tn=G.tn||{w:0,b:0};G.tn[G.t]++;if(G.aug&&G.aug[G.t]==35&&G.tn[G.t]==4){const k=b.findIndex(p=>p&&p.t=='K'&&p.c==G.t);if(k>=0){log(nm(b[k])+' — 죽음! 킹이 사라졌다');b[k]=null}}
 const ps=b.filter(Boolean),kw=ps.some(p=>p.t=="K"&&p.c=="w"),kb=ps.some(p=>p.t=="K"&&p.c=="b");
 if(!kw||!kb)return fin(kw?"w":"b","킹이 쓰러졌다");
 if(ps.length==2)return fin(0,"양쪽 킹만 남아 무승부");
 const nx=G.t=="w"?"b":"w";
 if(!b.some((p,i)=>p&&p.c==nx&&mvs(b,i).length))return fin(G.t,(nx=="w"?"백":"흑")+"은 움직일 기물이 없다");
 G.t=nx;G.tt=120;G.busy=0;render();cpu()}

/* AI: 기대 피해 기반 평가 */
const E=(a,d)=>{if(G.nm)return 9e3;const A=SX(a),B=SX(d);return A.h*(1-B.d)*A.a*(1+A.c)};
function allMoves(b,c){const o=[];b.forEach((p,i)=>{if(p&&p.c==c)moves(b,i).forEach(m=>o.push([i,m.to]))});return o}
function ap(b,f,t,full){const b2=b.map(p=>p&&{...p}),a=b2[f],d=b2[t];
 if(d){d.hp-=E(a,d);if(d.hp<=0){b2[t]=a;b2[f]=null}else if(full&&moves(b2,t).some(m=>m.to==f&&m.cap)){a.hp-=E(d,a);if(a.hp<=0)b2[f]=null}}else{b2[t]=a;b2[f]=null}
 if(full&&b2[t]===a){a.m=1;if(a.t=='P'&&(t>>3)==(a.c=='w'?0:7)){a.t='Q';a.hp=150}}
 return b2}
function sc(b,f,t,risk){const a=b[f],d=b[t];let s=0;
 if(d){const e=E(a,d),k=Math.min(1,e/d.hp);s+=(ST[d.t].v+(d.t=="K"?15:0))*k*10;
  if(risk&&e<d.hp&&moves(b,t).some(m=>m.to==f&&m.cap))s-=ST[a.t].v*Math.min(1,E(d,a)/a.hp)*10}
 else s+=a.t=="P"?(a.c=="b"?t>>3:7-(t>>3))*.5:.2*(3.5-Math.abs(3.5-(t&7)));
 if(risk){const b2=ap(b,f,t),pos=b2[t]&&b2[t].c==a.c?t:f,q=b2[pos];let mx=0;
  b2.forEach((e,i)=>{if(e&&e.c!=a.c&&moves(b2,i).some(m=>m.to==pos&&m.cap))mx=Math.max(mx,E(e,q)/q.hp)});
  s-=ST[q.t].v*Math.min(1,mx)*10}
 return s}
function pick(b,lv){if(lv=='hard'||lv=='impossible')return deep(b,lv);const ms=(G.nm?legalAll:allMoves)(b,G.ac);
 if(lv=="easy")return ms[Math.random()*ms.length|0];
 let best=ms[0],bs=-1e9;
 for(const m of ms){let s=sc(b,m[0],m[1],lv!="normal");
  if(lv=="impossible"){const b2=ap(b,m[0],m[1]);let mx=0;
   allMoves(b2,"w").forEach(r=>{const x=sc(b2,r[0],r[1],0);if(x>mx)mx=x});s-=mx*.7}
  s+=Math.random()*(lv=="normal"?4:.3);
  if(s>bs){bs=s;best=m}}
 return best}
let AC='b';

 if(pw.length<4)return lbMsg('비밀번호를 4자 이상으로 직접 만들어 입력하세요.');
 const code=hid(pw);
 try{const sn=await db.doc(RP(code)).get();if(sn.exists){const o=sn.data();if(o.host!=UID&&!o.over)return lbMsg('이미 쓰고 있는 비밀번호예요. 다른 비밀번호로 만들어 주세요.')}
  await db.doc(RP(code)).set({host:UID,guest:'',hc:cfg.me,nm:!!cfg.nm,ao:cfg.aug&&!cfg.nm?pick6():[],pw:0,pb:0,gs:[Math.random(),Math.random()],first:cfg.nm?'w':Math.random()<.5?'w':'b',ml:[],over:''})}
 catch(e){return lbMsg('방을 만들 수 없어요 ('+(e.code||'오류')+') — 서버 연결을 확인해 주세요.')}
 lbMsg('방을 만들었어요. 상대가 같은 비밀번호로 입장하면 시작돼요.');enter(code,cfg.me,cfg.nm)}
async function joinRoom(){const db=await dbInit();if(!db)return;const pw=$('#lbc').value.trim(),code=hid(pw);
 try{const sn=await db.doc(RP(code)).get();if(!pw||!sn.exists)return lbMsg('그 비밀번호의 방이 없어요.');const d=sn.data();
  if(d.host==UID){enter(code,d.hc,d.nm);return}
  if(d.guest&&d.guest!=UID)return lbMsg('이미 가득 찬 방이에요.');
  if(!d.guest)await db.doc(RP(code)).update({guest:UID});
  enter(code,d.hc=='w'?'b':'w',d.nm)}catch(e){lbMsg('입장할 수 없어요 ('+(e.code||'오류')+') — 서버 연결을 확인해 주세요.')}}
async function resume(){const v=LS.get();if(!v)return;try{const db=await dbInit();if(!db)return;const sn=await db.doc(RP(v.code)).get();if(sn.exists&&!sn.data().over)enter(v.code,v.me,v.nm)}catch(e){}}
async function sync(d){const g=G;if(!d||!g||!g.on)return;if(syncing){pend=d;return}syncing=1;
 try{
  if(g.wait){if(!d.guest)return;g.wait=0;g.coin=1;render();
   if(!d.ml.length&&!g.nm){await coin(d.first);if(g!==G)return}
   const dr=!g.nm&&d.ao&&d.ao.length;Object.assign(g,{coin:0,t:d.first,tt:g.nm?99999:120,busy:dr?1:0});$('#lb').hidden=true;log((g.nm?'일반 체스 · ':'동전 결과: ')+(d.first=='w'?'백':'흑')+' 선공 · 나는 '+(g.me=='w'?'백':'흑'));render();if(dr)draftStart(d.first,d.ao,d.gs,{w:d.pw,b:d.pb})}
  const oc=g.me=='w'?'b':'w';if(g.draft&&(d['p'+oc]||0)!=g.ag.p[oc]){g.ag.p[oc]=d['p'+oc]||0;draftNext()}
  while(g===G&&!g.draft&&g.applied<d.ml.length){const m=JSON.parse(d.ml[g.applied]);g.fast=d.ml.length-g.applied>1;g.ml.push(d.ml[g.applied]);g.applied++;g.rq=m.rn.slice();g.fpr=m.pr||null;await act(m.f,m.t);g.rq=null;g.fpr=null}
  g.fast=0;
  if(g===G&&d.over&&!g.over){const o=JSON.parse(d.over);fin(o.w||0,o.msg)}
 }finally{syncing=0;if(pend){const p=pend;pend=null;sync(p)}}}
async function play(f,t){const g=G;if(!g.on)return act(f,t);
 g.rec=[];g.rpr=null;await act(f,t);if(g!==G)return;
 const mv={f,t,rn:g.rec,pr:g.rpr||''};g.rec=null;g.ml.push(JSON.stringify(mv));g.applied=g.ml.length;
 try{await DB.doc(RP(g.code)).update({ml:g.ml})}catch(e){log('전송 실패: '+(e.code||''));render()}}
function overPush(){if(G.on&&DB&&G.code)DB.doc(RP(G.code)).update({over:JSON.stringify({w:G.rw||0,msg:G.rm||''})}).catch(()=>{})}

$('#menu').onclick=e=>{const m=e.target.dataset.m;if(m!==undefined){cfg.lv=m;menu()}};
$('#cl').onclick=e=>{const c=e.target.dataset.c;if(c){cfg.me=c;menu()}};
$('#go').onclick=go;$('#nmb').onclick=()=>{cfg.nm=!cfg.nm;menu()};$('#agb').onclick=()=>{cfg.aug=!cfg.aug;menu()};$('#ac2').onclick=e=>{if(e.target.dataset.av)avShow()};$('#agd').onclick=adShow;$('#adx').onclick=()=>{$('#ad').hidden=true};$('#av').onclick=e=>{if(e.target.id=='av'||e.target.id=='avx')avClose()};$('#agl').onclick=e=>{const c=e.target.closest('.ac');if(!c||!G.draft)return;const n=+c.dataset.n,col=['w','b'].find(x=>optsOf(x).includes(n));if(col&&canPick(col))pickAug(n,col)};$('#lx').onclick=()=>{$('#lb').hidden=true};$('#lmk').onclick=mkRoom;$('#ljn').onclick=joinRoom;$('#gd').onclick=()=>{guide();$('#gm').hidden=false};$('#gx').onclick=()=>{$('#gm').hidden=true};$('#gm').onclick=e=>{if(e.target.id=='gm')e.target.hidden=true};$('#again').onclick=go;$('#see').onclick=()=>{$('#rs').hidden=true};
$("#pm").onclick=e=>{const t=e.target.dataset.t;if(t&&G.pr)G.pr(t)};
$("#bd").onclick=e=>{const el=e.target.closest(".c");
 if(!el||G.busy||G.over||(G.ai&&G.t==G.ac)||(G.on&&G.t!=G.me))return;
 const i=+el.dataset.i,p=G.b[i];
 if(G.sel!=null&&mvs(G.b,G.sel).some(m=>m.to==i)){play(G.sel,i);return}
 if(p){G.info=p;G.sel=p.c==G.t?i:null}else G.sel=null;
 render()};
setInterval(()=>{if(!G||G.over||G.busy||!$('#av').hidden)return;G.T[G.t]-=.25;G.tt-=.25;
 if(G.T[G.t]<=0||G.tt<=0){fin(G.t=="w"?"b":"w",(G.t=="w"?"백":"흑")+" 시간 초과");overPush()}else renderT()},250);
G=blank();render();resume();
</script></body></html>
